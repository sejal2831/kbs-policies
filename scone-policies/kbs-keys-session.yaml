name: kbs-policies-v4/kbs-keys
version: "0.3.10"

secrets:
  - name: kbs-private-key
    kind: private-key

  - name: kbs-cert
    kind: x509-ca
    private_key: kbs-private-key
    common_name: kbs-service
    export_public: true

access_policy:
  read:
    - ANY
  update:
    - signer: |
        -----BEGIN PUBLIC KEY-----
        MCowBQYDK2VwAyEA1Qa0GnCN+HmHEOk0+323sXvVX+NPw4kgUFnpOlRXSH4=
        -----END PUBLIC KEY-----

security:
  attestation:
    mode: hardware
    tolerate: [debug-mode, hyperthreading, outdated-tcb, software-hardening-needed, insecure-configuration]
    ignore_advisories: "*"
