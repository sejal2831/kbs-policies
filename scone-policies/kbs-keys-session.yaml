name: kbs-policies-v4/kbs-keys
version: "0.3.10"
predecessor: 14aa65f633aba4dd522e6238e95eafae1070d4c4d7f72eaf9762b43966be99fa

secrets:
  - name: kbs-private-key
    kind: private-key

  - name: kbs-cert
    kind: x509-ca
    private_key: kbs-private-key
    common_name: kbs-service
    export_public: true

access_policy:
  read:
    - ANY
  update:
    - ANY

security:
  attestation:
    mode: hardware
    tolerate: [debug-mode, hyperthreading, outdated-tcb, software-hardening-needed, insecure-configuration]
    ignore_advisories: "*"
