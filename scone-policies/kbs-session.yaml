name: kbs-policies-v4
version: "0.3.10"

secrets:
  - name: kbs-private-key
    kind: private-key

  - name: kbs-cert
    kind: x509-ca
    private_key: kbs-private-key
    common_name: kbs-service
    export_public: true

services:
  - name: kbs
    attestation:
      - mrenclave:
        - dfd6b0161e8b64342eff8bd56c53db09bc4e15c1331adc6e5da60d61db58f425
        signer:
          mrsigner: 11c4e150b76c2b145f7fadb6c30455e1046b9e6fbb75b49c6e13341ad8acc5bd
          isvprodid: 0

access_policy:
  read:
    - ANY
  update:
    - signer: |
        -----BEGIN PUBLIC KEY-----
        MCowBQYDK2VwAyEA1Qa0GnCN+HmHEOk0+323sXvVX+NPw4kgUFnpOlRXSH4=
        -----END PUBLIC KEY-----

security:
  attestation:
    mode: hardware
    tolerate: [debug-mode, hyperthreading, outdated-tcb, software-hardening-needed, insecure-configuration]
    ignore_advisories: "*"
predecessor: f085726ba2c547075ce388d0350a18a9d881d49f05fc498ad2594db257324059
